<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Schippeaux Home</title>
<style>
  /* Layout: phone-homescreen grid of app icons on a dark gradient wallpaper, radiating from a top glow */
  :root{
    --bg-top: #1b2030;
    --bg-bottom: #0a0c12;
    --fg: #f3f4f6;
    --fg-dim: rgba(243,244,246,0.55);
    --fg-faint: rgba(243,244,246,0.32);
    --tile-radius: 22%;
    --soon-opacity: 0.45;
    --font-display: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100%;
    height:100%;
    background:
      radial-gradient(circle at 50% 0%, #262d42 0%, var(--bg-top) 38%, var(--bg-bottom) 100%);
    background-attachment: fixed;
    color: var(--fg);
    font-family: var(--font-body);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top: 56px;
    padding-bottom: 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wallpaper-header{
    text-align:center;
    margin-bottom: 44px;
  }
  .wallpaper-header h1{
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0 0 6px;
    color: var(--fg-dim);
  }
  .wallpaper-header p{
    font-size: 13px;
    margin: 0;
    color: var(--fg-faint);
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px 22px;
    width: 100%;
    max-width: 420px;
  }
  .app{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-decoration:none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  .icon{
    width: 64px;
    height: 64px;
    border-radius: var(--tile-radius);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.14);
    transition: transform 0.15s ease;
    position:relative;
  }
  .app:active .icon{ transform: scale(0.92); }
  .icon svg{ width: 32px; height: 32px; }
  .label{
    margin-top: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg);
    text-align:center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }

  .icon.photography{ background: linear-gradient(145deg, #5eb3ff 0%, #1565c0 100%); }
  .icon.strummy{ background: linear-gradient(145deg, #ff9d66 0%, #c23b2e 100%); }
  .icon.flippy{ background: linear-gradient(145deg, #b47cf8 0%, #5b21b6 100%); }
  .icon.vueltita{ background: linear-gradient(145deg, #4ade9e 0%, #047857 100%); }
  .icon.new-home{ background: linear-gradient(145deg, #fbc44f 0%, #b45309 100%); }
  .icon.snaggo{ background: linear-gradient(145deg, #94a3b8 0%, #334155 100%); opacity: var(--soon-opacity); }

  .app.disabled{ pointer-events: none; }
  .badge{
    position:absolute;
    bottom:-5px; right:-5px;
    background:#1e2535;
    color: var(--fg-dim);
    font-size:8px;
    font-weight:700;
    letter-spacing:0.04em;
    padding: 2px 5px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.18);
    white-space:nowrap;
  }

  footer{
    margin-top: 56px;
    color: var(--fg-faint);
    font-size: 11px;
    text-align:center;
  }
  footer a{ color: var(--fg-dim); text-decoration:none; }
  footer a:hover{ text-decoration:underline; }
</style>

<div class="wallpaper-header">
  <h1>Schippeaux</h1>
  <p>Projects &amp; experiments</p>
</div>

<div class="grid">

  <a class="app" href="/photography/">
    <div class="icon photography">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h3l2-2h6l2 2h3v12H4z"/>
        <circle cx="12" cy="13" r="3.4"/>
      </svg>
    </div>
    <div class="label">Photography</div>
  </a>

  <a class="app disabled" href="/strummy/" aria-disabled="true">
    <div class="icon strummy">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8.5" cy="16.5" r="3"/>
        <path d="M11 16.5V5l8-2v11.5"/>
        <circle cx="16.5" cy="14.5" r="3"/>
      </svg>
      <span class="badge">SOON</span>
    </div>
    <div class="label">Strummy</div>
  </a>

  <a class="app" href="/Flippy_2/">
    <div class="icon flippy">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="6" width="13" height="13" rx="2"/>
        <path d="M8 6V4.6c0-.9.7-1.6 1.6-1.6H19c.9 0 1.6.7 1.6 1.6V15c0 .9-.7 1.6-1.6 1.6h-1.4"/>
      </svg>
    </div>
    <div class="label">Flippy</div>
  </a>

  <a class="app" href="/Vueltita/">
    <div class="icon vueltita">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12a8 8 0 1 1 2.6 5.9"/>
        <path d="M4 18v-4h4"/>
      </svg>
    </div>
    <div class="label">Vueltita</div>
  </a>

  <a class="app" href="/new-home-schedule/">
    <div class="icon new-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 11.5 12 4l8 7.5"/>
        <path d="M6 10v9.5h12V10"/>
      </svg>
    </div>
    <div class="label">New Home</div>
  </a>

  <a class="app" href="/snaggo/">
    <div class="icon snaggo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="4" width="14" height="17" rx="2"/>
        <path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/>
        <path d="M9 11.5l2 2 4-4.2"/>
      </svg>
    </div>
    <div class="label">Snaggo</div>
  </a>

</div>

<footer>
  <a href="https://github.com/schippeaux" target="_blank" rel="noopener">github.com/schippeaux</a>
</footer>

</body></html>
